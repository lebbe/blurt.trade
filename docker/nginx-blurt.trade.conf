# /etc/nginx/sites-available/blurt.trade, linked into sites-enabled. Certbot adds the HTTPS part:
#   sudo certbot --nginx -d blurt.trade
# The app sends HSTS and the other security headers itself (TRUST_PROXY=1 in the compose file).
server {
    listen 80;
    listen [::]:80;
    server_name blurt.trade;

    # Mobile photos are several MB; the app allows 15 MB (pictureMaxUploadBytes).
    client_max_body_size 16m;
    gzip on;
    # HTML is always compressed; add the stylesheets (style.css is about 36 kB raw and blocks
    # the first paint), the web app manifest, the SVG map and the client modules (/static/js/).
    gzip_types text/css application/manifest+json image/svg+xml text/javascript;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;

    # The live-update stream (Server-Sent Events): passed through as it is written, never
    # buffered or compressed (text/event-stream isn't in gzip_types, and the app also sends
    # X-Accel-Buffering: no). A heartbeat every 25 s keeps it inside proxy_read_timeout.
    location = /api/events {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
