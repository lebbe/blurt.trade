# /etc/nginx/sites-available/blurt.trade, linked into sites-enabled. Certbot adds the HTTPS part:
#   sudo certbot --nginx -d blurt.trade
# The app sends HSTS and the other security headers itself (TRUST_PROXY=1 in the compose file).
server {
    listen 80;
    listen [::]:80;
    server_name blurt.trade;

    # Mobile photos are several MB; the app allows 15 MB (pictureMaxUploadBytes).
    client_max_body_size 16m;
    gzip on;
    gzip_types image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
