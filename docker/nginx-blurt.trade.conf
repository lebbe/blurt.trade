# /etc/nginx/sites-available/blurt.trade, linked into sites-enabled. Certbot adds the HTTPS part:
#   sudo certbot --nginx -d blurt.trade
# The app sends HSTS and the other security headers itself (TRUST_PROXY=1 in the compose file).
#
# HTTP/2 and HTTP/3: production runs nginx 1.26 or newer from nginx.org (the Ubuntu package is
# 1.24, without QUIC). After certbot has added the 443 block, add these lines to it:
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     listen 443 quic reuseport;
#     listen [::]:443 quic reuseport;
#     add_header Alt-Svc 'h3=":443"; ma=86400' always;
# UDP 443 must be open next to TCP 443 (ufw: "allow 443" covers both). Without HTTP/2 the
# site loads over HTTP/1.1, and Lighthouse flags it ("Use HTTP/2"), costing about 620 ms on a
# first mobile load. `reuseport` may appear on only one quic listen per address in the whole
# nginx config. Check: DevTools, Network, Protocol column should say h3 after a second load.
server {
    listen 80;
    listen [::]:80;
    server_name blurt.trade;

    # Mobile photos are several MB; the app allows 15 MB (pictureMaxUploadBytes).
    client_max_body_size 16m;
    gzip on;
    # HTML is always compressed; add the SVG map and the client modules (/static/js/).
    gzip_types image/svg+xml text/javascript;

    # The live-update stream (Server-Sent Events): passed through as it is written, never
    # buffered or compressed (text/event-stream isn't in gzip_types, and the app also sends
    # X-Accel-Buffering: no). A heartbeat every 25 s keeps it inside proxy_read_timeout.
    location = /api/events {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
