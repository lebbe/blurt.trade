name: Build and publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      matrix:
        include:
          - name: app
            context: .
            image: ghcr.io/lebbe/blurt.trade
          - name: db
            context: docker/postgres
            image: ghcr.io/lebbe/blurt.trade-db
    name: ${{ matrix.name }}
    # A push whose commit message starts with "chore:" (or "chore(scope):"), e.g. a squash
    # merge of a docs-only PR, builds and deploys nothing. The deploy job needs this one,
    # so it is skipped too (and so is the blurt). A manual run always goes ahead.
    if: >-
      github.event_name != 'push' ||
      !(startsWith(github.event.head_commit.message, 'chore:') ||
        startsWith(github.event.head_commit.message, 'chore('))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    # One deploy at a time; a newer one waits for the running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Restart the server on the new images
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's command= on the server runs deploy-latest.sh, whatever is asked.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST"
      # The deploy bot blurts the commit message (docs/deploy.md, Deploying). Only on a push
      # (a manual run deploys nothing new), only if the token is set, and a failure here
      # doesn't fail the deploy.
      - name: Blurt about the deploy
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.DEPLOY_BOT_TOKEN }}
          SITE: ${{ vars.PUBLIC_URL || 'https://blurt.trade' }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "No DEPLOY_BOT_TOKEN, not blurting."; exit 0; fi
          # Wait for the new server to answer.
          for _ in $(seq 30); do curl -fsS -o /dev/null "$SITE/healthz" && break; sleep 2; done
          # GitHub's own "Merge pull request #1 from …" line says nothing: use what follows.
          # Blurts are at most 280 characters (code points, as jq counts them).
          body=$(jq -n --arg message "$MESSAGE" '
            ($message | sub("^Merge (pull request|branch) [^\n]*\n+"; "") | gsub("^\\s+|\\s+$"; ""))
            as $m
            | "New deploy released: " as $p
            | (280 - ($p | length)) as $room
            | { text: ($p + (if ($m | length) > $room then $m[0:$room - 1] + "…" else $m end)) }')
          curl -fsS --retry 3 --retry-connrefused -o /dev/null -w '%{http_code}\n' \
            -H "Authorization: Bearer $BOT_TOKEN" -H 'Content-Type: application/json' \
            -d "$body" "$SITE/api/v1/blurts"
