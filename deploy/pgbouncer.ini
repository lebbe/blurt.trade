; /etc/pgbouncer/pgbouncer.ini for production: the same settings as db/setup-wsl.sh,
; on the standard ports (PostgreSQL 5432, PgBouncer 6432). userlist.txt holds the
; blurt role's password: "blurt" "SCRAM-SHA-256$..." (from pg_authid, see docs/deploy.md).
[databases]
blurt = host=127.0.0.1 port=5432 dbname=blurt
; With a read replica: blurt_read = host=REPLICA_HOST port=5432 dbname=blurt

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = transaction
default_pool_size = 20
max_client_conn = 500
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
